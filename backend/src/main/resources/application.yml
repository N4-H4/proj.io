spring:
  application:
    name: projio

  datasource:
    url: jdbc:mysql://localhost:3306/projio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

# JWT Configuration
app:
  jwt:
    secret: proj-io-jwt-secret-key-change-in-production-must-be-at-least-256-bits-long-for-hs256
    expiration-ms: 86400000  # 24 hours
